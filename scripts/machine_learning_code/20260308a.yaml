# 消融基线（小样本优化）：~1000 样本，较小容量 + 较强正则，减少过拟合
# 骨干维度 32、单层 Transformer、时间点 2；消融实验 20260308b～g 均基于此基线
# Usage: python main.py --config scripts/machine_learning_code/20260308a.yaml --train

experiment:
  name: "20260308a"
  seed: 42

data:
  num_freq_points: 63
  num_time_points: 2

train:
  batch_size: 8
  num_epochs: 20000
  learning_rate: 1e-4
  weight_decay: 5e-4
  eval_every: 100

  sampler:
    base_weight: 1.0
    rapid_weight: 3.0

  trainer:
    alpha: 0.05
    beta: 1.0
    gamma: 6.0e-5
    lambda_rule: 5.0e-4
    lambda_group: 5.0e-4
    lambda_tree: 5.0e-4
    lambda_band: 2.0e-3
    save_every: 10
    label_smoothing: 0.05

  train_pairs:
    lambda_consistency: 5.0e-4
    eps: 1.0e-9
    use_log_space: true
    lambda_monodec: 5.0e-4
    lambda_polarity: 2.0e-4
    weight_ratio: 3.0

test:
  device_str: "cpu"
  max_workers_factor: 0.5

paths:
  data_folder: "datasets/datasets_for_all_no_overlap"
  test_folder: "datasets/datasets_for_all_test_no_overlap"
  model_save_root: "output/trained_model_save"
  stats_file: "datasets/stats_dataset.json"
  label_mapping_json: "label_mapping.json"
  debug_log_dir: "output/debug_logs"
  tensorboard_root: "output/tensorboard"

dataset:
  keep_unpaired: "self"
  debug: true
  focus_prefix_contains: "20240915_2ppm铜离子污染测试_旧版电解槽_ion_firecloud_"
  max_print: 0

model:
  volt_input_dim: 1
  volt_mlp_hidden_dims: [32]
  mlp_output_dims: 32
  volt_mlp_num_layers: 1
  impe_input_dim: 2
  impe_mlp_hidden_dims: [32]
  impe_mlp_num_layers: 1
  transformer_d_model: 32
  nhead: 4
  transformer_num_layers: 1
  param_transformer_num_layers: 1
  physic_mlp_hidden_dims: [32]
  physic_mlp_num_layers: 1
  ion_attr_embed_hidden_dims: [32]
  ion_attr_embed_num_layers: 1
  ion_encoder_num_layers: 1
  ion_post_hidden_dims: [32]
  ion_post_num_layers: 1
  probMLP_input_dims: 32
  probMLP_hidden_dims: [32]
  probMLP_num_layers: 1
  param_mlp_hidden_dims: [32]
  param_mlp_num_layers: 1
  freq_encoder_hidden_dims: [32]
  freq_encoder_num_layers: 1
  time_encoder_hidden_dims: [32]
  time_encoder_num_layers: 1
  cross_transformer_num_layers: 1
  param_embed_hidden_dims: [32]
  param_embed_num_layers: 0
  physic_embed_hidden_dims: [32]
  physic_embed_num_layers: 0
  envMLP_input_dim: 3
  env_mlp_hidden_dims: [32]
  env_mlp_num_layers: 1
  ep_input_dim: 8
  ep_mlp_hidden_dims: [32]
  ep_mlp_num_layers: 1
  Z_encoder_num_layers: 1
