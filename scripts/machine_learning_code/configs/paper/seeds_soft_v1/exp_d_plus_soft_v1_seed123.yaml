experiment:
  name: exp_d_plus_soft_v1_seed123
  seed: 123
data:
  num_freq_points: 63
  num_time_points: 3
train:
  batch_size: 8
  num_epochs: 600
  learning_rate: 1e-4
  weight_decay: 1e-3
  eval_every: 10
  sampler:
    base_weight: 1.0
    rapid_weight: 3.0
  trainer:
    beta: 1.0
    alpha: 0.05
    gamma: 0.0002
    lambda_rule: 0.0
    lambda_group: 0.002
    lambda_tree: 0.002
    lambda_band: 0.0
    save_every: 50
    label_smoothing: 0.05
    grad_clip: 1.0
  train_pairs:
    lambda_consistency: 0.002
    eps: 1.0e-09
    use_log_space: true
    lambda_monodec: 0.002
    lambda_polarity: 0.001
    weight_ratio: 1.0
test:
  device_str: cpu
  max_workers_factor: 0.5
paths:
  data_folder: datasets/datasets_for_all_train_no_overlap/SWC-PSWM_plus_soft_v1_seed123
  test_folder: datasets/datasets_for_all_test_no_overlap/SWC-PSWM_plus_soft_v1_seed123
  model_save_root: output/trained_model_save
  stats_file: datasets/stats_dataset.json
  label_mapping_json: label_mapping.json
  debug_log_dir: output/debug_logs
  tensorboard_root: output/tensorboard
dataset:
  keep_unpaired: self
  debug: true
  focus_prefix_contains: 20240915_2ppm铜离子污染测试_旧版电解槽_ion_firecloud_
  max_print: 0
new_model:
  d_model: 64
  nhead: 4
  num_layers: 2
  dropout: 0.1
  num_classes: 7
  classify_mode: clip_v2
  use_env: true
  use_physics: true
  use_cross_attn: true
  use_hierarchical: true
  use_rule: true
  use_band_feat: true
  use_conc: true
  use_cosine_lr: true
  warmup_epochs: 100
  clip_use_chem_only: true
  clip_preprocess_attrs: true
  clip_learnable_no_ion: true
  clip_attr_dropout: 0.0
  clip_logit_scale_init: 14.2857
