# ============================================================
# 消融实验 A：纯分类基线（Linear Head, CE Only）
# ============================================================
# 目的：测试 EIS + 电压数据经 Transformer 编码后的纯判别能力
# 对比基线：LSTM (Acc=0.8542, F1=0.8172)
#
# 架构：
#   - 电压 MLP + 时间编码
#   - 阻抗 MLP + 时间编码 + 频率编码
#   - 环境参数/电解槽参数编码（额外 token）
#   - Transformer self-attention → CLS token
#   - Linear 分类头 → 7 类
#
# 关键改进（vs 旧模型 20260308a）：
#   - d_model: 32 → 64（更大容量）
#   - num_layers: 1 → 2（更深编码）
#   - 添加 dropout=0.1 正则
#   - 梯度裁剪 max_norm=1.0
#   - Cosine Annealing LR 调度
#   - 只有 CE 分类损失，无其他辅助损失（排除干扰）
#   - 自动保存 best F1 模型
#
# 后续实验计划：
#   exp_new_b: use_env=false → 测试环境参数 token 是否有帮助
#   exp_new_c: classify_mode="clip" → 测试 CLIP 对齐 vs linear
#   exp_new_d: use_physics=true (无 cross_attn) → 物理分支但分类仍走 cls_output(全时间点)
#   exp_new_e: use_physics+use_cross_attn+clip → 分类走 cross_pooled
#              (Query=param_raw 初始状态标定, KV=physic_raw 全时间点影响因子)
#   exp_new_f: 在最佳组合上逐个加辅助损失(hierarchical/rule/band/conc)
#
# 运行命令：
#   python scripts/machine_learning_code/main.py \
#     --config scripts/machine_learning_code/exp_new_a.yaml --train

experiment:
  name: "exp_new_a"
  seed: 42

data:
  num_freq_points: 63
  num_time_points: 3

train:
  batch_size: 8
  num_epochs: 1000
  learning_rate: 1e-4
  weight_decay: 1e-3
  eval_every: 10

  sampler:
    base_weight: 1.0
    rapid_weight: 3.0

  trainer:
    beta: 1.0
    alpha: 0.0
    gamma: 0.0
    lambda_rule: 0.0
    lambda_group: 0.0
    lambda_tree: 0.0
    lambda_band: 0.0
    save_every: 50
    label_smoothing: 0.0
    grad_clip: 1.0

  train_pairs:
    lambda_consistency: 0.0
    eps: 1.0e-9
    use_log_space: true
    lambda_monodec: 0.0
    lambda_polarity: 0.0
    weight_ratio: 3.0

test:
  device_str: "cpu"
  max_workers_factor: 0.5

paths:
  data_folder: "datasets/datasets_for_all_no_overlap"
  test_folder: "datasets/datasets_for_all_test_no_overlap"
  model_save_root: "output/trained_model_save"
  stats_file: "datasets/stats_dataset.json"
  label_mapping_json: "label_mapping.json"
  debug_log_dir: "output/debug_logs"
  tensorboard_root: "output/tensorboard"

dataset:
  keep_unpaired: "self"
  debug: true
  focus_prefix_contains: "20240915_2ppm铜离子污染测试_旧版电解槽_ion_firecloud_"
  max_print: 0

# ===== 新模型配置（存在此字段即使用新模型） =====
new_model:
  d_model: 64
  nhead: 4
  num_layers: 2
  dropout: 0.1
  num_classes: 7
  classify_mode: "linear"
  use_env: true
  use_physics: false
  use_cross_attn: false
  use_hierarchical: false
  use_rule: false
  use_band_feat: false
  use_conc: false
  use_cosine_lr: true
  warmup_epochs: 100
