# ============================================================
# 消融实验 H：Exp-F − 成对一致性损失（L_dyn）
# ============================================================
# 目的：在全模型（Exp-F）基础上，移除所有成对动态约束损失，
#       验证成对一致性 / 单调衰减 / 极性约束对分类性能的贡献。
#
# 与 Exp-F 的区别：
#   lambda_consistency: 5e-4 → 0.0  （配对一致性损失）
#   lambda_monodec:     5e-4 → 0.0  （单调衰减约束）
#   lambda_polarity:    2e-4 → 0.0  （极性约束）
#
# 运行命令：
#   python scripts/machine_learning_code/main.py \
#     --config scripts/machine_learning_code/exp_new_h.yaml --train

experiment:
  name: "exp_new_h"
  seed: 42

data:
  num_freq_points: 63
  num_time_points: 3

train:
  batch_size: 8
  num_epochs: 1000
  learning_rate: 1e-4
  weight_decay: 1e-3
  eval_every: 10

  sampler:
    base_weight: 1.0
    rapid_weight: 3.0

  trainer:
    beta: 1.0
    alpha: 0.05
    gamma: 6.0e-5
    lambda_rule: 5.0e-4
    lambda_group: 5.0e-4
    lambda_tree: 5.0e-4
    lambda_band: 0.0
    save_every: 50
    label_smoothing: 0.05
    grad_clip: 1.0

  train_pairs:
    lambda_consistency: 0.0      # ← 移除配对一致性损失
    eps: 1.0e-9
    use_log_space: true
    lambda_monodec: 0.0          # ← 移除单调衰减约束
    lambda_polarity: 0.0         # ← 移除极性约束
    weight_ratio: 3.0

test:
  device_str: "cpu"
  max_workers_factor: 0.5

paths:
  data_folder: "datasets/datasets_for_all_no_overlap"
  test_folder: "datasets/datasets_for_all_test_no_overlap"
  model_save_root: "output/trained_model_save"
  stats_file: "datasets/stats_dataset.json"
  label_mapping_json: "label_mapping.json"
  debug_log_dir: "output/debug_logs"
  tensorboard_root: "output/tensorboard"

dataset:
  keep_unpaired: "self"
  debug: true
  focus_prefix_contains: "20240915_2ppm铜离子污染测试_旧版电解槽_ion_firecloud_"
  max_print: 0

new_model:
  d_model: 64
  nhead: 4
  num_layers: 2
  dropout: 0.1
  num_classes: 7
  classify_mode: "clip"
  use_env: true
  use_physics: true
  use_cross_attn: true
  use_hierarchical: true
  use_rule: true
  use_band_feat: true
  use_conc: true
  use_cosine_lr: true
  warmup_epochs: 100
